[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acute-slice-mea"
version = "0.1.0"
description = "Python and Jupyter Notebook template for acute-slice multi-electrode array data analysis."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "ipywidgets",
    "plotly",
    "seaborn",
    "h5py",
    "spikeinterface",
    "scikit-learn",
    "joblib",
    "xarray",
    "networkx",
    "zarr",
    "tqdm",
    "pydantic",
    "dash>=2.18",
]

[project.scripts]
acute-slice-mea = "acute_slice_mea.cli:main"
acute-slice-viewer = "acute_slice_mea.viewer.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
